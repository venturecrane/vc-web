name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Gate on `critical` (not `high`) so a newly-published framework advisory
      # cannot silently break deploys with zero code change on our side (this is
      # what froze deploys June 11-23: an Astro high-sev whose only fix is a
      # breaking 5->7 major). High-sev advisories are patched where non-breaking
      # (see package.json overrides) and the residual Astro upgrade is tracked.
      - run: npm audit --omit=dev --audit-level=critical
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          configPath: ./lighthouserc.json

  deploy:
    needs: [build, lighthouse]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Cloudflare Pages API rejects commit messages containing non-ASCII
          # characters with "Invalid commit message, it must be a valid UTF-8
          # string. [code: 8000111]" - the error is misleading; the strings
          # ARE valid UTF-8, but the API silently requires printable ASCII.
          # Strip to printable ASCII + tab/LF/CR before passing to wrangler.
          # We invoke wrangler directly (instead of cloudflare/wrangler-action)
          # because that action's `command:` input is whitespace-tokenized and
          # cannot pass a multi-word --commit-message argument safely.
          MESSAGE=$(git log -1 --pretty=%B | LC_ALL=C tr -cd '\11\12\15\40-\176')
          npx --yes wrangler@3 pages deploy dist/ \
            --project-name=vc-web \
            --commit-message="$MESSAGE"
