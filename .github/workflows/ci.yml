name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Scheduled publishing: content dated in the future is merged to main and
  # hidden until its date (src/lib/publish.ts). This daily rebuild at 00:10
  # America/Phoenix (UTC-7 year-round, no DST) reveals whatever became due.
  schedule:
    - cron: '10 7 * * *'
  # Manual rebuild + deploy of main, for catching up after a skipped cron run.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Dependency audit runs beside the build, not in front of the deploy. An
  # advisory landing against a transitive dependency must not stop the daily
  # publish (that is how the site froze June 11-23). security.yml owns the
  # posture and files the loud issue; this job keeps the signal on every PR.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  lighthouse:
    needs: build
    # Performance gate for code changes. Skipped on the daily rebuild so a flaky
    # Lighthouse run cannot block a scheduled publish.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          configPath: ./lighthouserc.json

  deploy:
    needs: [build, lighthouse]
    # Deploys main on push, on the daily schedule, and on manual dispatch.
    # `lighthouse` is skipped on schedule/dispatch, so its result is accepted as
    # either success or skipped; `build` must have succeeded.
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.build.result == 'success' &&
      (needs.lighthouse.result == 'success' || needs.lighthouse.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Cloudflare Pages API rejects commit messages containing non-ASCII
          # characters with "Invalid commit message, it must be a valid UTF-8
          # string. [code: 8000111]" - the error is misleading; the strings
          # ARE valid UTF-8, but the API silently requires printable ASCII.
          # Strip to printable ASCII + tab/LF/CR before passing to wrangler.
          # We invoke wrangler directly (instead of cloudflare/wrangler-action)
          # because that action's `command:` input is whitespace-tokenized and
          # cannot pass a multi-word --commit-message argument safely.
          MESSAGE=$(git log -1 --pretty=%B | LC_ALL=C tr -cd '\11\12\15\40-\176')
          if [ "$EVENT_NAME" != "push" ]; then
            MESSAGE="scheduled rebuild ($EVENT_NAME): $MESSAGE"
          fi
          npx --yes wrangler@3 pages deploy dist/ \
            --project-name=vc-web \
            --commit-message="$MESSAGE"
